services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports: ['27017:27017']
    volumes: ['mongo_data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
    image: commerce-file-storage-minio:7aac2a2
    command: server /data --console-address :9001
    restart: unless-stopped
    ports: ['9000:9000', '9001:9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-commerce_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-development-password-change-me}
    volumes: ['minio_data:/data']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: amazon/aws-cli:2.31.18
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket commerce-files || true;
        aws --endpoint-url http://minio:9000 s3api put-bucket-versioning --bucket commerce-files --versioning-configuration Status=Enabled
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-commerce_admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-development-password-change-me}
      AWS_DEFAULT_REGION: us-east-1

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports: ['127.0.0.1:3310:3310']
    environment:
      CLAMD_CONF_StreamMaxLength: 50M
    volumes: ['clamav_signatures:/var/lib/clamav']

volumes:
  mongo_data:
  minio_data:
  clamav_signatures:
